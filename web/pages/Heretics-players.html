        <script>
    const playerCards = Array.from(document.querySelectorAll('.Jokalaria'));
    const expandButton = document.querySelector('.extentsioa');
    let expanded = false;
    function updatePlayers() {
        playerCards.forEach((card, index) => {
            const isVisible = expanded || index < 2;
            card.classList.toggle('ezkutatua', !isVisible);
        });
        expandButton.innerHTML = expanded
            ? 'ikusi gutxiago <span>←</span>'
            : 'ikusi gehiago <span>→</span>';
    }
    expandButton.addEventListener('click', () => {
        expanded = !expanded;
        updatePlayers();
    });
    updatePlayers();
</script>
